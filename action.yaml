name: "Cargo-Rail planner"
description: "Install Cargo-Rail and create one validated named-work plan for exact CI routing."
author: "loadingalias"

branding:
  icon: "git-branch"
  color: "orange"

inputs:
  version:
    description: "Exact compatible Cargo-Rail release to install"
    required: false
    default: "0.26.0"
  components:
    description: "Verified component set: core, surface, or complete"
    required: false
    default: "core"
  since:
    description: "Exact Git comparison ref; otherwise selected from the GitHub event"
    required: false
    default: ""
  all:
    description: "Require every registered work item instead of comparing changes"
    required: false
    default: "false"
  evidence:
    description: "Optional planning-evidence-v1 JSON file inside the workspace"
    required: false
    default: ""
  working-directory:
    description: "Workspace directory containing Cargo.toml"
    required: false
    default: "."
  repository-token:
    description: "GitHub token used only for same-repository history acquisition"
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: "Exact Cargo-Rail release installed by the planner"
    value: ${{ steps.runtime.outputs.version }}
  plan-file:
    description: "Absolute path to the validated Cargo-Rail plan"
    value: ${{ steps.runtime.outputs.plan-file }}
  required-work:
    description: "Compact JSON array of required named-work IDs"
    value: ${{ steps.runtime.outputs.required-work }}

runs:
  using: "composite"
  steps:
    - name: Create and validate Cargo-Rail plan
      id: runtime
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_COMPONENTS: ${{ inputs.components }}
        INPUT_SINCE: ${{ inputs.since }}
        INPUT_ALL: ${{ inputs.all }}
        INPUT_EVIDENCE: ${{ inputs.evidence }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_REPOSITORY_TOKEN: ${{ inputs.repository-token }}
      run: bash "$GITHUB_ACTION_PATH/scripts/bootstrap.sh" run planner
