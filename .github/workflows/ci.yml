name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: action

jobs:
  check:
    name: Check / ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # CI artifacts are published later, so retain the runtime's glibc 2.39 baseline.
          - runner: runs-on=${{ github.run_id }}/runner=x86_64-linux/image=ubuntu24-full-x64/spot=false/env=production
            target: x86_64-unknown-linux-gnu
            timeout: 30
          - runner: runs-on=${{ github.run_id }}/runner=x86_64-win/spot=false/env=production
            target: x86_64-pc-windows-msvc
            timeout: 60
          - runner: macos-15
            target: aarch64-apple-darwin
            timeout: 60
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: action
          persist-credentials: false
      - name: Checkout pinned runner tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: loadingalias/cargo-rail
          ref: c85d12a4cb4a5844c7536a5530b2be4d4d976511
          path: .ci-tooling
          persist-credentials: false
      - name: Install Linux tooling
        if: runner.os == 'Linux'
        run: ../.ci-tooling/scripts/tooling/x86_64-linux.sh ci
      - name: Install Windows tooling
        if: runner.os == 'Windows'
        shell: powershell
        run: ../.ci-tooling/scripts/tooling/x86_64-win.ps1 -Operation ci
      - name: Install macOS tooling
        if: runner.os == 'macOS'
        run: |
          ../.ci-tooling/scripts/tooling/package-unix.sh aarch64-apple-darwin
          expected="$(sed -n 's/^channel = "\([^" ]*\)"$/\1/p' rust-toolchain.toml)"
          rustup component add --toolchain "$expected" clippy rustfmt
      - name: Validate active toolchain
        run: |
          expected="$(sed -n 's/^channel = "\([^" ]*\)"$/\1/p' rust-toolchain.toml)"
          [[ "$RUSTUP_TOOLCHAIN" == "$expected" ]]
          if [[ "$RUNNER_OS" == Windows ]]; then
            printf 'CARGO_RAIL_TEST_BASH=%s\n' "$(cygpath -w "$BASH")" >> "$GITHUB_ENV"
          fi
      - name: Check, test, and exercise the packaged runtime
        env:
          TARGET: ${{ matrix.target }}
        run: |
          just check
          cargo build --release --locked
          suffix=""
          [[ "$TARGET" != *windows-msvc ]] || suffix=.exe
          runtime="$(pwd -P)/target/release/cargo-rail-action$suffix"
          if command -v sha256sum >/dev/null; then
            digest="$(sha256sum "$runtime" | awk '{print $1}')"
          else
            digest="$(shasum -a 256 "$runtime" | awk '{print $1}')"
          fi
          # Exercise both initial installation and reuse of the authenticated runtime.
          for _attempt in 1 2; do
            GITHUB_ACTION_PATH="$(pwd -P)" bash scripts/bootstrap.sh \
              --local-runtime "$runtime" --local-runtime-sha256 "$digest" \
              self-check --expect-version 9.0.0 --expect-target "$TARGET"
          done
          mkdir -p "$RUNNER_TEMP/runtime-assets"
          cp "$runtime" "$RUNNER_TEMP/runtime-assets/cargo-rail-action-$TARGET$suffix"
      - name: Test the Cargo-Rail source-to-release contract
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          archive="cargo-rail-$TARGET.zip"
          url=https://github.com/loadingalias/cargo-rail/releases/download/v0.26.0
          status="$(curl --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --output "$temporary/release.json" --write-out '%{http_code}' \
            https://api.github.com/repos/loadingalias/cargo-rail/releases/tags/v0.26.0)"
          case "$status" in
            200)
              for asset in "$archive" SHA256SUMS; do
                curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
                  "$url/$asset" --output "$temporary/$asset"
              done
              ;;
            404)
              (
                cd "$GITHUB_WORKSPACE/.ci-tooling"
                cargo fetch --locked
                cargo fetch --locked --manifest-path tools/compiler-fact-driver/Cargo.toml
                just package-release "$temporary"
              )
              ;;
            *) echo "Cargo-Rail release lookup failed with HTTP $status" >&2; exit 1 ;;
          esac
          awk -v archive="$archive" '$2 == archive' "$temporary/SHA256SUMS" > "$temporary/checksum"
          [[ "$(wc -l < "$temporary/checksum")" -eq 1 ]]
          (
            cd "$temporary"
            if command -v sha256sum >/dev/null; then
              sha256sum --check --strict checksum
            else
              shasum -a 256 --check --strict checksum
            fi
          )
          suffix=""
          if [[ "$TARGET" == *windows-msvc ]]; then
            suffix=.exe
            # shellcheck disable=SC2016
            ARCHIVE="$(cygpath -w "$temporary/$archive")" DESTINATION="$(cygpath -w "$temporary")" \
              powershell -NoProfile -NonInteractive -Command 'Expand-Archive -LiteralPath $env:ARCHIVE -DestinationPath $env:DESTINATION'
          else
            unzip -q "$temporary/$archive" -d "$temporary"
          fi
          just check-cargo-rail "$temporary/cargo-rail/cargo-rail$suffix" "$temporary/$archive" 0.26.0
          git diff --exit-code HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: runtime-${{ matrix.target }}
          path: ${{ runner.temp }}/runtime-assets/*
          if-no-files-found: error
          retention-days: 14
