name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 5.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Tests must pass before releasing
  test:
    uses: ./.github/workflows/test.yaml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases must run from main, got $GITHUB_REF"
            exit 1
          fi

          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format. Use x.y.z (e.g., 1.0.2)"
            exit 1
          fi

          if git rev-parse "v$VERSION" &>/dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          MAJOR="v${VERSION%%.*}"  # 1.0.2 -> v1

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create version tag
          git tag -a "v$VERSION" -m "v$VERSION"

          # Update or create the floating major tag.
          if git rev-parse "$MAJOR" &>/dev/null; then
            git tag -fa "$MAJOR" -m "$MAJOR: Latest ${MAJOR}.x release"
          else
            git tag -a "$MAJOR" -m "$MAJOR: Latest ${MAJOR}.x release"
          fi

          # Push tags
          git push origin "v$VERSION"
          git push origin "$MAJOR" --force

          # Create GitHub release
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            --latest

          {
            echo "## Released v$VERSION"
            echo ""
            echo "- Tag: \`v$VERSION\`"
            echo "- Floating tag: \`$MAJOR\` → v$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
