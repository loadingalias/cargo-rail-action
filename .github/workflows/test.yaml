name: Test Action

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call: # Allow other workflows to call this

jobs:
  lint-action-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate action.yaml
        run: ruby -ryaml -e 'YAML.load_file("action.yaml")'

  fixture-tests:
    needs: lint-action-yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run summary fixture tests
        run: ./tests/test_summary.sh
      - name: Run contract fixture tests
        run: bash ./tests/test_contracts.sh
      - name: Run history fixture tests
        run: bash ./tests/test_ensure_history.sh
      - name: Run release fixture tests
        run: bash ./tests/test_release.sh

  # ============================================================================
  # Self-test: Create minimal workspace, no external dependencies
  # ============================================================================
  self-test:
    needs: [lint-action-yaml, fixture-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create test workspace
        shell: bash
        run: bash tests/create_workspace.sh test-workspace

      - name: Run action
        id: rail
        uses: ./
        with:
          mode: debug
          since: HEAD~1
          working-directory: test-workspace

      - name: Verify outputs
        run: |
          echo "=== Outputs ==="
          echo "build: ${{ steps.rail.outputs.build }}"
          echo "test: ${{ steps.rail.outputs.test }}"
          echo "scope-json: ${{ steps.rail.outputs.scope-json }}"
          echo "surfaces-json: ${{ steps.rail.outputs.surfaces-json }}"
          echo "plan-json: ${{ steps.rail.outputs.plan-json }}"

          [[ "${{ steps.rail.outputs.build }}" == "true" ]] || { echo "expected build=true"; exit 1; }
          [[ "${{ steps.rail.outputs.test }}" == "true" ]] || { echo "expected test=true"; exit 1; }
          [[ "$(cargo-rail rail --version)" == "cargo-rail 0.20.1" ]] || {
            echo "expected cargo-rail 0.20.1"
            exit 1
          }
          echo '${{ steps.rail.outputs.scope-json }}' | jq . || { echo "scope-json not valid JSON"; exit 1; }
          [[ "$(echo '${{ steps.rail.outputs.surfaces-json }}' | jq -r '.build')" == "true" ]] || {
            echo "expected surfaces-json build=true"
            exit 1
          }
          [[ "$(echo '${{ steps.rail.outputs.surfaces-json }}' | jq -r '.test')" == "true" ]] || {
            echo "expected surfaces-json test=true"
            exit 1
          }
          echo '${{ steps.rail.outputs.plan-json }}' | jq . || { echo "plan-json not valid JSON"; exit 1; }
          [[ -n "${{ steps.rail.outputs.base-ref }}" ]] || { echo "base-ref missing"; exit 1; }

          echo "Self-test passed!"

  # ============================================================================
  # Multi-platform test
  # ============================================================================
  test-platforms:
    needs: [lint-action-yaml, fixture-tests]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create test workspace
        shell: bash
        run: bash tests/create_workspace.sh test-workspace

      - name: Run action
        id: rail
        uses: ./
        with:
          mode: minimal
          since: HEAD~1
          working-directory: test-workspace

      - name: Verify
        shell: bash
        run: |
          echo "Platform: ${{ matrix.os }}"
          echo "Scope JSON: ${{ steps.rail.outputs.scope-json }}"
          [[ "$(cargo-rail rail --version)" == "cargo-rail 0.20.1" ]] || {
            echo "expected cargo-rail 0.20.1"
            exit 1
          }
          echo '${{ steps.rail.outputs.scope-json }}' | jq . >/dev/null || exit 1
          echo '${{ steps.rail.outputs.surfaces-json }}' | jq . >/dev/null || exit 1
          echo "Platform test passed!"
