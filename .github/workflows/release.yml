name: Release
on:
  workflow_dispatch:
    inputs:
      transaction:
        description: Retained transaction to continue; empty starts a new request
        type: string
      intent:
        description: Immutable intent identity supplied by Cargo-Rail
        type: string
      source:
        description: Exact request source supplied by Cargo-Rail
        type: string
      bump:
        description: auto, major, minor, patch, prerelease, release, or an exact version
        type: string
        default: auto
      review:
        description: Review preparation through a pull request
        type: boolean
        default: false
  pull_request_target:
    types: [closed]
permissions: {}
concurrency:
  group: cargo-rail-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'rail/release-') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: release
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Build this Action runtime
        run: |
          channel="$(sed -n 's/^channel = "\([^" ]*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
          cargo build --locked
      - name: Execute the shared release engine
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: "0.26.0"
          INPUT_PACKAGES: "[]"
          INPUT_BUMP: ${{ inputs.bump || 'auto' }}
          INPUT_PUBLISH: "false"
          INPUT_REVIEW: ${{ inputs.review && 'true' || 'false' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          target/debug/cargo-rail-action run release
