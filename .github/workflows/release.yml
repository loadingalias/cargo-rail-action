name: Release

on:
  workflow_dispatch:
    inputs:
      transaction:
        description: Recovery only; retained transaction ID
        type: string
      intent:
        description: Recovery only; retained intent identity
        type: string
      source:
        description: Recovery only; retained source commit
        type: string

permissions: {}

concurrency:
  group: cargo-rail-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: release
    permissions:
      contents: write # Publish the release commit, tag, assets, and major alias.
      actions: write # Dispatch and inspect the exact package workflow run.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the Cargo-Rail lock
        id: cargo-rail
        run: bash scripts/read-cargo-rail-lock.sh >> "$GITHUB_OUTPUT"
      - name: Build this Action runtime
        run: |
          channel="$(sed -n 's/^channel = "\([^" ]*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
          cargo build --locked
      - name: Execute the shared release engine
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ steps.cargo-rail.outputs.version }}
          INPUT_PACKAGES: "[]"
          INPUT_BUMP: auto
          INPUT_PUBLISH: "false"
          INPUT_REVIEW: "false"
        run: |
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          target/debug/cargo-rail-action run release
