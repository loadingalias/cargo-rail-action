name: Release v9.0.0

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-v9
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require CI for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f branch=main -f per_page=100 \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")] | max_by(.id)')"
          jq -e --arg sha "$GITHUB_SHA" \
            '.head_sha == $sha and .status == "completed" and .conclusion == "success"' <<< "$run"
          printf 'run-id=%s\n' "$(jq -r .id <<< "$run")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci.outputs.run-id }}
          pattern: runtime-*
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Bind the tested runtimes to this release
        run: |
          ASSETS="$RUNNER_TEMP/release"
          RUNTIME="$ASSETS/cargo-rail-action-x86_64-unknown-linux-gnu"
          chmod 700 "$RUNTIME"
          "$RUNTIME" self-check --expect-version 9.0.0 --expect-target x86_64-unknown-linux-gnu
          "$RUNTIME" release intent --source-commit "$GITHUB_SHA" \
            --manifest "$ASSETS/cargo-rail-action-runtime-v1.tsv" \
            --asset "$ASSETS/cargo-rail-action-aarch64-apple-darwin" \
            --asset "$ASSETS/cargo-rail-action-x86_64-pc-windows-msvc.exe" \
            --asset "$RUNTIME" --output "$ASSETS/release-intent.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-v9.0.0
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck CI before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f branch=main -f per_page=100 \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")] | max_by(.id)')"
          jq -e --arg sha "$GITHUB_SHA" \
            '.head_sha == $sha and .status == "completed" and .conclusion == "success"' <<< "$run"
          printf 'run-id=%s\n' "$(jq -r .id <<< "$run")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-v9.0.0
          path: ${{ runner.temp }}/release
      - name: Publish v9.0.0 and promote v9
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS="$RUNNER_TEMP/release"
          RUNTIME="$ASSETS/cargo-rail-action-x86_64-unknown-linux-gnu"
          chmod 700 "$RUNTIME"
          authority=(--intent "$ASSETS/release-intent.json"
            --asset "$ASSETS/cargo-rail-action-aarch64-apple-darwin"
            --asset "$ASSETS/cargo-rail-action-runtime-v1.tsv"
            --asset "$ASSETS/cargo-rail-action-x86_64-pc-windows-msvc.exe"
            --asset "$RUNTIME")
          "$RUNTIME" release publish --check "${authority[@]}"
          "$RUNTIME" release publish --apply "${authority[@]}"
          "$RUNTIME" release promote --check "${authority[@]}"
          "$RUNTIME" release promote --apply "${authority[@]}"
