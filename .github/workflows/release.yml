name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: auto, major, minor, patch, prerelease, release, or an exact version
        type: string
        default: auto

permissions: {}

concurrency:
  group: cargo-rail-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write # Push the release commit and tag, and create the draft release.
      actions: read # Exclude this run from the checks gate.
      checks: read # Read the source commit's check runs.
      pull-requests: read # Find open and merged release pull requests.
      statuses: read # Read the source commit's commit statuses.
    outputs:
      state: ${{ steps.release.outputs.state }}
      tags: ${{ steps.release.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the Cargo-Rail lock
        id: cargo-rail
        run: bash scripts/read-cargo-rail-lock.sh >> "$GITHUB_OUTPUT"
      - name: Build this Action runtime
        run: |
          channel="$(sed -n 's/^channel = "\([^" ]*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
          cargo build --locked
      - name: Run cargo rail release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ steps.cargo-rail.outputs.version }}
          INPUT_CRATES: ''
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_PULL_REQUEST: 'false'
          INPUT_DRY_RUN: 'false'
        run: target/debug/cargo-rail-action run release

  package:
    name: Package
    needs: release
    if: needs.release.outputs.state == 'awaiting_assets'
    permissions:
      contents: read
    uses: ./.github/workflows/package.yml # zizmor: ignore[self-repository]
    with:
      release-tag: ${{ fromJSON(needs.release.outputs.tags)[0] }}

  assets:
    name: Assets
    needs: [release, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Attach the runtimes to the draft release.
      id-token: write # Mint the Sigstore signing certificate.
      attestations: write # Persist the signed provenance.
      artifact-metadata: write # Record the attested artifact subjects.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release.outputs.tags)[0] }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtime-*
          path: ${{ runner.temp }}/runtimes
      - name: Build the authenticated runtime manifest
        run: |
          mkdir "$RUNNER_TEMP/assets"
          cp "$RUNNER_TEMP"/runtimes/*/cargo-rail-action-* "$RUNNER_TEMP/assets/"
          for license in "$RUNNER_TEMP"/runtimes/*/LICENSE; do cmp LICENSE "$license"; done
          cp LICENSE "$RUNNER_TEMP/assets/LICENSE"
          chmod 700 "$RUNNER_TEMP/assets/cargo-rail-action-x86_64-unknown-linux-gnu"
          args=()
          for asset in "$RUNNER_TEMP"/assets/*; do args+=(--asset "$asset"); done
          "$RUNNER_TEMP/assets/cargo-rail-action-x86_64-unknown-linux-gnu" release package "${args[@]}" \
            --output "$RUNNER_TEMP/assets/cargo-rail-action-runtime-v1.tsv"
      - name: Attest and attach release assets
        uses: ./release/asset # zizmor: ignore[self-repository]
        with:
          tag: ${{ fromJSON(needs.release.outputs.tags)[0] }}
          files: ${{ runner.temp }}/assets/*

  publish:
    name: Publish
    needs: [release, assets]
    if: needs.assets.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # Publish the release and move its major alias.
      actions: read # Exclude this run from the checks gate.
      checks: read # Read the source commit's check runs.
      pull-requests: read # Find merged release pull requests.
      statuses: read # Read the source commit's commit statuses.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the Cargo-Rail lock
        id: cargo-rail
        run: bash scripts/read-cargo-rail-lock.sh >> "$GITHUB_OUTPUT"
      - name: Build this Action runtime
        run: |
          channel="$(sed -n 's/^channel = "\([^" ]*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
          cargo build --locked
      - name: Finish the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ steps.cargo-rail.outputs.version }}
          INPUT_CRATES: ''
          INPUT_BUMP: auto
          INPUT_PULL_REQUEST: 'false'
          INPUT_DRY_RUN: 'false'
        run: target/debug/cargo-rail-action run release
