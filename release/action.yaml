name: Cargo-Rail release
description: Run `cargo rail release` with the locked Cargo-Rail release and publish its result.
author: loadingalias
inputs:
  runtime-source:
    description: "Action runtime authority: authenticated release asset or checked-out source"
    default: release
  version:
    description: Exact Cargo-Rail release to install; default matches .github/cargo-rail.lock
    default: 0.31.1
  crates:
    description: Crates to release, separated by whitespace; empty releases every crate with release-worthy changes
    default: ''
  bump:
    description: auto, major, minor, patch, prerelease, release, or an exact version
    default: auto
  pull-request:
    description: Land the release commit through a pull request instead of pushing it
    default: 'false'
  dry-run:
    description: Preview and run every check without any effect
    default: 'false'
  token:
    description: Token for GitHub and for pushing the release commit and tags
    default: ${{ github.token }}
outputs:
  state:
    description: nothing_to_release, planned, pull_request, awaiting_checks, awaiting_assets, or released
    value: ${{ steps.runtime.outputs.state }}
  commit:
    description: The release commit, once it exists
    value: ${{ steps.runtime.outputs.commit }}
  tags:
    description: JSON array of the release's tags
    value: ${{ steps.runtime.outputs.tags }}
  pull-request:
    description: The release pull request URL, with pull-request
    value: ${{ steps.runtime.outputs.pull-request }}
runs:
  using: composite
  steps:
    - name: Run cargo rail release
      id: runtime
      shell: bash
      env:
        CARGO_RAIL_ACTION_RUNTIME_SOURCE: ${{ inputs.runtime-source }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_CRATES: ${{ inputs.crates }}
        INPUT_BUMP: ${{ inputs.bump }}
        INPUT_PULL_REQUEST: ${{ inputs.pull-request }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        GH_TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/bootstrap.sh" run release
