name: Cargo-Rail release
description: Validate a GitHub release invocation and execute the durable Cargo-Rail transaction.
author: loadingalias
inputs:
  version:
    description: Exact Cargo-Rail release to install; default matches .github/cargo-rail.lock
    default: 0.27.1
  packages:
    description: JSON array of package names; an empty array selects the workspace
    default: '[]'
  bump:
    description: auto, major, minor, patch, prerelease, release, or an exact version
    default: auto
  publish:
    description: Authorize crates.io publication for a new request
    default: 'false'
  review:
    description: Review preparation through a pull request
    default: 'false'
outputs:
  transaction-id:
    description: Original durable transaction identity
    value: ${{ steps.runtime.outputs.transaction-id }}
  release-sha:
    description: Exact release source
    value: ${{ steps.runtime.outputs.release-sha }}
  state:
    description: Retained transaction status
    value: ${{ steps.runtime.outputs.state }}
  run-url:
    description: Hosted execution URL
    value: ${{ steps.runtime.outputs.run-url }}
runs:
  using: composite
  steps:
    - name: Execute Cargo-Rail release
      id: runtime
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_PACKAGES: ${{ inputs.packages }}
        INPUT_BUMP: ${{ inputs.bump }}
        INPUT_PUBLISH: ${{ inputs.publish }}
        INPUT_REVIEW: ${{ inputs.review }}
        GH_TOKEN: ${{ github.token }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/bootstrap.sh" run release
