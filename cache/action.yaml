name: "Cargo-Rail compiler cache"
description: "Install Cargo-Rail once so ordinary Cargo commands share verified compiler results."
author: "loadingalias"

branding:
  icon: "database"
  color: "orange"

inputs:
  url:
    description: "AWS S3, Azure Blob Storage, or Cloudflare R2 cache URL"
    required: true

  mode:
    description: "Remote authority: read or read-write"
    required: false
    default: "read-write"

  max-size:
    description: "Job-local verified cache bound, such as 10GiB"
    required: false
    default: "10GiB"

  local-dir:
    description: "Optional job-local cache base directory"
    required: false
    default: ""

  version:
    description: "cargo-rail version to install"
    required: false
    default: "0.22.0"

  checksum:
    description: "Release checksum policy: required, if-available, or off"
    required: false
    default: "required"

  token:
    description: "GitHub token for downloading Cargo-Rail releases"
    required: false
    default: ${{ github.token }}

  working-directory:
    description: "Working directory containing Cargo.toml"
    required: false
    default: "."

outputs:
  install-method:
    description: "How Cargo-Rail was installed"
    value: ${{ steps.install.outputs.method }}

  version:
    description: "Installed Cargo-Rail version"
    value: ${{ steps.install.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Install cargo-rail
      id: install
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REQUESTED_VERSION: ${{ inputs.version }}
        CHECKSUM_MODE: ${{ inputs.checksum }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/install.sh"

    - name: Configure compiler cache
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CACHE_URL: ${{ inputs.url }}
        CACHE_MODE: ${{ inputs.mode }}
        CACHE_MAX_SIZE: ${{ inputs.max-size }}
        CACHE_LOCAL_DIR: ${{ inputs.local-dir }}
      run: |
        set -euo pipefail
        case "$CACHE_MODE" in
          read|read-write) ;;
          *)
            echo "::error::mode must be read or read-write"
            exit 1
            ;;
        esac
        SETUP_ARGS=(--remote "$CACHE_URL" --remote-mode "$CACHE_MODE" --max-size "$CACHE_MAX_SIZE")
        if [[ -n "$CACHE_LOCAL_DIR" ]]; then
          SETUP_ARGS+=(--local-dir "$CACHE_LOCAL_DIR")
        fi
        cargo rail cache setup "${SETUP_ARGS[@]}"
