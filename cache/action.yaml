name: "Cargo-Rail compiler cache"
description: "Configure explicit remote compiler-cache authority for ordinary Cargo commands."
author: "loadingalias"

branding:
  icon: "database"
  color: "orange"

inputs:
  remote:
    description: "AWS S3, Azure Blob Storage, Cloudflare R2, or S3-compatible cache authority"
    required: true
  mode:
    description: "Explicit remote authority: read or read-write"
    required: true
  max-size:
    description: "Job-local verified-cache bound, such as 10GiB"
    required: false
    default: "10GiB"
  local-dir:
    description: "Optional job-local cache base directory"
    required: false
    default: ""
  root-portability:
    description: "Cross-checkout authority: physical or remap"
    required: false
    default: "physical"
  verify-remote:
    description: "Fail unless the selected remote store and protocol marker are reachable"
    required: false
    default: "false"
  version:
    description: "Exact compatible Cargo-Rail release to install"
    required: false
    default: "0.26.0"
  working-directory:
    description: "Workspace directory used for cache setup"
    required: false
    default: "."

outputs:
  version:
    description: "Exact Cargo-Rail release installed by the cache action"
    value: ${{ steps.runtime.outputs.version }}
  status:
    description: "Compact redacted cargo-rail-action-cache-status-v1 JSON"
    value: ${{ steps.runtime.outputs.status }}

runs:
  using: "composite"
  steps:
    - name: Configure and validate Cargo-Rail compiler cache
      id: runtime
      shell: bash
      env:
        INPUT_REMOTE: ${{ inputs.remote }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_MAX_SIZE: ${{ inputs.max-size }}
        INPUT_LOCAL_DIR: ${{ inputs.local-dir }}
        INPUT_ROOT_PORTABILITY: ${{ inputs.root-portability }}
        INPUT_VERIFY_REMOTE: ${{ inputs.verify-remote }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/bootstrap.sh" run cache
