name: "Cargo-Rail compiler cache"
description: "Configure explicit remote compiler-cache authority for ordinary Cargo commands."
author: "loadingalias"

branding:
  icon: "database"
  color: "orange"

inputs:
  url:
    description: "AWS S3, Azure Blob Storage, or Cloudflare R2 cache authority"
    required: true

  mode:
    description: "Explicit remote authority: read or read-write"
    required: true

  max-size:
    description: "Job-local verified-cache bound, such as 10GiB"
    required: false
    default: "10GiB"

  local-dir:
    description: "Optional job-local cache base directory"
    required: false
    default: ""

  version:
    description: "Exact Cargo-Rail release to install"
    required: false
    default: "0.24.0"

  token:
    description: "GitHub token used only to download Cargo-Rail releases"
    required: false
    default: ${{ github.token }}

  working-directory:
    description: "Workspace directory used for cache setup"
    required: false
    default: "."

outputs:
  install-method:
    description: "How Cargo-Rail was installed"
    value: ${{ steps.install.outputs.method }}

  version:
    description: "Installed Cargo-Rail version"
    value: ${{ steps.install.outputs.version }}

  status-json:
    description: "Versioned redacted projection of local setup and remote policy"
    value: ${{ steps.setup.outputs.status_json }}

  healthy:
    description: "Whether the installed cache integration is healthy"
    value: ${{ steps.setup.outputs.healthy }}

  provider:
    description: "Selected remote provider"
    value: ${{ steps.setup.outputs.provider }}

  mode:
    description: "Selected remote authority"
    value: ${{ steps.setup.outputs.mode }}

  activation:
    description: "Selected remote transport state"
    value: ${{ steps.setup.outputs.activation }}

  max-bytes:
    description: "Effective local L1 byte bound"
    value: ${{ steps.setup.outputs.max_bytes }}

runs:
  using: "composite"
  steps:
    - name: Install Cargo-Rail cache components
      id: install
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REQUESTED_VERSION: ${{ inputs.version }}
        COMPONENT_SET: cache
      run: bash "$GITHUB_ACTION_PATH/../scripts/install.sh"

    - name: Configure and verify compiler cache
      id: setup
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CACHE_URL: ${{ inputs.url }}
        CACHE_MODE: ${{ inputs.mode }}
        CACHE_MAX_SIZE: ${{ inputs.max-size }}
        CACHE_LOCAL_DIR: ${{ inputs.local-dir }}
        INSTALL_METHOD: ${{ steps.install.outputs.method }}
        INSTALL_VERSION: ${{ steps.install.outputs.version }}
      run: >-
        python3 "$GITHUB_ACTION_PATH/../scripts/cache_setup.py"
        --url "$CACHE_URL"
        --mode "$CACHE_MODE"
        --max-size "$CACHE_MAX_SIZE"
        --local-dir "$CACHE_LOCAL_DIR"
        --install-method "$INSTALL_METHOD"
        --install-version "$INSTALL_VERSION"
        --github-output "$GITHUB_OUTPUT"
        --summary "$GITHUB_STEP_SUMMARY"
