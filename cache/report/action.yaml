name: "Report Cargo-Rail cache results"
description: "Publish one workflow cache summary from bounded job records, including missing-job coverage."
inputs:
  records-directory:
    description: "Directory containing the downloaded job JSON records"
    required: true
  expected-jobs:
    description: "JSON array of the unique job labels expected to contribute measurements"
    required: true
runs:
  using: "composite"
  steps:
    - name: Report workflow cache results
      shell: bash
      env:
        INPUT_RECORDS_DIRECTORY: ${{ inputs.records-directory }}
        INPUT_EXPECTED_JOBS: ${{ inputs.expected-jobs }}
      run: bash "$GITHUB_ACTION_PATH/../../scripts/bootstrap.sh" run cache-report
