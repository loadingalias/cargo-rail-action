name: "Cargo-Rail setup"
description: "Install the native Cargo-Rail Action runtime and matching Cargo-Rail core release."
author: "loadingalias"

inputs:
  version:
    description: "Exact Cargo-Rail release to install; default matches .github/cargo-rail.lock"
    required: false
    default: "0.27.1"

outputs:
  version:
    description: "Exact Cargo-Rail release installed"
    value: ${{ steps.runtime.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Install Cargo-Rail plan consumer
      id: runtime
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/bootstrap.sh" run setup
